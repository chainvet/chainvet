[package]
name = "chainvet-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
chainvet-core = { path = "../chainvet-core" }
chainvet-ai = { path = "../chainvet-ai" }
chainvet-frontend = { path = "../chainvet-frontend" }
chainvet-sa = { path = "../chainvet-sa" }
chainvet-se = { path = "../chainvet-se" }
chainvet-fuzzing = { path = "../chainvet-fuzzing" }
chainvet-hybrid = { path = "../chainvet-hybrid" }
# Opt-in EVM validation layer. Pulls in revm, so it is off by default and only
# compiled when a frontend enables the `evm-validation` feature. Runtime use is
# additionally gated by the CHAINVET_EVM_CONFIRM env var.
chainvet-evm = { path = "../chainvet-evm", optional = true }
serde = { version = "1", features = ["derive"] }

[features]
default = []
evm-validation = ["dep:chainvet-evm"]
