[package]
name = "chainvet-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chainvet"
path = "src/main.rs"

[dependencies]
chainvet-core = { path = "../chainvet-core" }
chainvet-frontend = { path = "../chainvet-frontend" }
chainvet-orchestrator = { path = "../chainvet-orchestrator" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
comfy-table = "7"

[features]
default = []
# Opt-in EVM confirmation of fuzzer findings (pulls in revm via the
# orchestrator). Build with `--features evm-validation`, then run with
# CHAINVET_EVM_CONFIRM=1 to flag/demote findings the real EVM refutes.
evm-validation = ["chainvet-orchestrator/evm-validation"]
